# ─── JVM Memory ──────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ─── AndroidX ────────────────────────────────────────────────────
android.useAndroidX=true

# ─── ✅ Fix: Kotlin incremental cache "different roots" error ─────
# المشكلة: pub cache على C:\ والمشروع على D:\ → الـ Kotlin compiler
# بيحاول يعمل relative path بين دrivين مختلفين وبيفشل
# الحل: نوقف الـ incremental compilation للـ Kotlin (أبطأ شوية بس مفيش errors)
kotlin.incremental=false

# ─── ✅ Performance ───────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── ✅ Fix: R8 missing classes → نحوله لـ warning بدل error ─────
android.enableR8.fullMode=false
