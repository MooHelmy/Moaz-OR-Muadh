name: medi_guard
description: AI Media Guard - Auto Background Scanner

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cloud_firestore: ^4.15.0
  crypto: ^3.0.3
  firebase_core: ^2.27.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^8.0.0
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^2.5.1
  google_mlkit_face_detection: ^0.9.0
  hive_flutter: ^1.1.0
  image: ^4.1.3
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  tflite_flutter: ^0.10.4
  uuid: ^4.3.3
  workmanager: ^0.5.2

dev_dependencies:
  build_runner: ^2.4.8
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
