name: Muadh
description: AI Media Guard - Auto Background Scanner
version: 1.0.0+1
environment:
  # workmanager 0.7.0 يتطلب Dart >=3.2 — نرفع الحد الأدنى
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  battery_plus: ^6.2.2
  flutter:
    sdk: flutter
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^18.0.1
  flutter_onnxruntime: ^1.7.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.3
  google_mlkit_face_detection: ^0.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image: ^4.1.3
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  typed_data: ^1.4.0
  uuid: ^4.3.3
  video_player: ^2.8.1
  video_thumbnail: ^0.5.6
  workmanager: ^0.7.0

dev_dependencies:
  build_runner: ^2.4.8
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icon/
